name: Build IPA
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          xcodebuild -scheme "Mon app" -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          find build -name "*.app" -maxdepth 6
          APP=$(find build/Build/Products -name "*.app" -maxdepth 3 | head -n 1)
          echo "APP trouvé : $APP"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -r app.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: app.ipa
